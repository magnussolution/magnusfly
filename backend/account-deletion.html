<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MagnusFly Account Deletion</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.5; margin: 0; color: #172033; background: #f5f7fa; }
    main { max-width: 680px; margin: 0 auto; padding: 32px 20px; background: white; min-height: 100vh; }
    label { display: block; margin: 16px 0 5px; }
    input { box-sizing: border-box; width: 100%; padding: 11px; font: inherit; }
    button { margin-top: 18px; padding: 11px 16px; font: inherit; }
    #status { margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>MagnusFly account deletion</h1>
    <p>Deleting your account permanently removes your profile and its towing sessions and telemetry from MagnusFly. This cannot be undone.</p>
    <form id="delete-form">
      <label for="username">Username</label>
      <input id="username" name="username" required autocomplete="username">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <label><input name="confirm" type="checkbox" required style="width:auto"> I understand this is permanent.</label>
      <button type="submit">Delete account and data</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p><a href="/magnusfly/privacy.html">Privacy policy</a></p>
  </main>
  <script>
    const form = document.querySelector('#delete-form');
    const status = document.querySelector('#status');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      status.textContent = 'Submitting deletion request…';
      try {
        const response = await fetch('/magnusfly/api/pilots/delete.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: form.username.value,
            email: form.email.value,
            password: form.password.value
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error?.message || 'Request failed.');
        form.reset();
        status.textContent = 'Your MagnusFly account and associated data have been deleted.';
      } catch (error) {
        status.textContent = error.message || 'Unable to delete the account. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
